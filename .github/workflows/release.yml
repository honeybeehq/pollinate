name: Release

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:
    inputs:
      sha:
        description: Full 40-character commit sha on main to release as runtime-<sha>
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-runtime-${{ github.event.workflow_run.head_sha || inputs.sha }}
  cancel-in-progress: false

jobs:
  release:
    name: runtime-${{ github.event.workflow_run.head_sha || inputs.sha }}
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || inputs.sha }}
      RELEASE_CI_RUN_URL: ${{ github.event.workflow_run.html_url }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Refuse anything but a full lowercase sha
        run: |
          if ! printf '%s' "$RELEASE_SHA" | grep -Eqx '[0-9a-f]{40}'; then
            echo "::error::refusing sha \"$RELEASE_SHA\": need a full 40-character lowercase hex commit sha"
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Build, pack, smoke-test and publish runtime-${{ env.RELEASE_SHA }}
        run: scripts/release-runtime.sh --publish --out "$RUNNER_TEMP/runtime" "$RELEASE_SHA"
